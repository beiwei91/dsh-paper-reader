name: Feature request / 功能建议
description: Suggest a capability for the Paper Reader tab, highlights, or the paper_* tools. / 为论文标签页、标注或 paper_* 工具提建议。
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What are you trying to do that the plugin makes hard today? / 当前哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其它方案
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        说明：扫描版 PDF 的 OCR 已在开发计划中，不需要再提 OCR 需求；请勿在 issue 中上传论文 PDF。
