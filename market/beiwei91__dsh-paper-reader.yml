name: dsh-paper-reader
owner: beiwei91
url: https://github.com/beiwei91/dsh-paper-reader
category: productivity
description:
  en: >-
    Paper Reader adds a Papers tab to the DSH right sidebar: read local PDFs and
    arXiv papers with continuous scrolling, outline jumps, in-document search and
    a remembered position; keep multi-colour highlights with margin notes; quote a
    selection into the conversation or ask the agent to explain/translate it; four
    read-only paper_* agent tools read the paper open in the session.
  zh: >-
    论文阅读器：在 DSH 右侧栏新增「论文」标签页，读本地 PDF 与 arXiv 论文（连续滚动、目录跳转、
    全文搜索、记忆位置）；四色高亮与边注按论文保存；选中原文可引用到对话、让 agent 解释/翻译；
    四个只读 paper_* 工具读取当前会话打开的论文。
install: "github:beiwei91/dsh-paper-reader"
added: "2026-11-14"
icon: https://raw.githubusercontent.com/beiwei91/dsh-paper-reader/v0.1.0/icon.svg
